name: Update Registry Stats

# Run the scraper every 6 hours and allow manual triggering
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: 

# Give the bot permission to push the updated JSON file back to your repo
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        run: node scraper.cjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add registry-stats.json
          
          # Only commit if the numbers actually changed to avoid empty commits
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated registry stats update" && git push)