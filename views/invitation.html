<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#7433B5">
        <title>Jamison & Isabelle's Wedding</title>
        <link rel="stylesheet" href="views/style.css" />
        <link rel="icon" type="image/png" href="images/cross.png">
        <script src="../invite.js" defer></script>
    </head>
    <body>
        <section id="invitePage">
            <div class="invite-envelope-wrapper">
                <div class="invite-envelope">
                    <!-- Envelope Flaps -->
                    <div class="invite-flap bottom"></div>
                    <div class="invite-flap left"></div>
                    <div class="invite-flap right"></div>

                    <!-- Invitation Card with Image -->
                    <div class="invite-letter">
                        <img src="../images/invitationCard.png" alt="Wedding Invitation" class="invite-card-img" />
                        <a href="/" class="invite-rsvp-btn">RSVP Here</a>
                    </div>

                    <!-- Top Flap (folded over top) -->
                    <div class="invite-flap top"></div>
                </div>
            </div>
        </section>
        <!-- Image Lightbox Modal -->
        <div id="imageModal" class="modal">
            <span class="close-btn">&times;</span>
            <img class="modal-content" id="expandedImg">
        </div>
    </body>
</html>
